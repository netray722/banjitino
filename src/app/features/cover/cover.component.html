<main class="cover" [style.background-image]="'url(' + coverImage() + ')'">
  <div class="shade" aria-hidden="true"></div>

  <nav class="cover-nav" aria-label="Primary">
    <a routerLink="/">Home</a>
    <a routerLink="/nba">NBA</a>
    <a routerLink="/fifa">FIFA</a>
  </nav>

  <section class="weather" aria-label="Local weather">
    <strong>{{ weather() }}</strong>
    <span>{{ place() }}</span>
  </section>

  <section class="clock" aria-label="Local time">
    <h1>{{ time() }}</h1>
  </section>

  <figure class="quote">
    <blockquote>“{{ quote().text }}”</blockquote>
    <figcaption>{{ quote().author }}</figcaption>
  </figure>
</main>
