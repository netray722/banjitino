<header class="site-header">
  <div class="dispatch-line" aria-hidden="true">
    <span>Personal index / New York</span>
    <span>Scores · notes · sidequests</span>
  </div>
  <div class="header-inner">
    <a class="brand" routerLink="/" aria-label="Banjitino sidequests home">
      <span class="brand-mark" aria-hidden="true">B.</span>
      <span class="brand-copy">
        <strong>Banjitino</strong>
        <small>Field notes for curious people</small>
      </span>
    </a>

    <nav class="primary-nav" aria-label="Primary">
      <a routerLink="/nba" routerLinkActive="active" ariaCurrentWhenActive="page">
        <span class="live-mark" aria-hidden="true"></span>
        NBA desk
      </a>
      <a routerLink="/workout" routerLinkActive="active" ariaCurrentWhenActive="page">
        Workout
      </a>
      <a routerLink="/pickup-five" routerLinkActive="active" ariaCurrentWhenActive="page">
        Pickup 5
      </a>
    </nav>

    <button
      class="theme-toggle"
      type="button"
      (click)="toggleTheme()"
      [attr.aria-label]="isDarkTheme() ? 'Switch to light theme' : 'Switch to dark theme'"
      [attr.title]="isDarkTheme() ? 'Switch to light theme' : 'Switch to dark theme'"
    >
      <span>{{ isDarkTheme() ? 'Light' : 'Dark' }}</span>
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2.2M12 19.8V22M2 12h2.2M19.8 12H22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M19.1 4.9l-1.6 1.6M6.5 17.5l-1.6 1.6"/></svg>
    </button>
  </div>
</header>
