<header class="timeline-toolbar">
  <div class="toolbar-inner">
    <div>
      <p class="eyebrow">{{ eyebrow() }}</p>
      <div class="date-controls">
        <button class="date-picker" type="button" (click)="openDatePicker(dateInput)" [attr.aria-label]="dateAriaLabel()">
          <svg lucideCalendarDays aria-hidden="true"></svg>
          <span>{{ dateLabel() }}</span>
        </button>
        @if (showToday()) { <button class="today-button" type="button" (click)="today.emit()" [disabled]="loading()">Today</button> }
      </div>
      <input #dateInput class="date-input" [id]="inputId()" type="date" [value]="date()" [min]="minDate()" [max]="maxDate()" (change)="changeDate($event)" [attr.aria-label]="dateAriaLabel()">
    </div>
    <div class="toolbar-actions">
      <span class="updated">{{ updatedLabel() }}</span>
      <button class="refresh-button" type="button" [class.is-spinning]="refreshing()" [disabled]="refreshing()" (click)="refresh.emit()" aria-label="Refresh timeline">
        <svg lucideRefreshCw aria-hidden="true"></svg>
      </button>
    </div>
  </div>
</header>
