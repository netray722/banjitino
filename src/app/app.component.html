<header class="site-header">
  <div class="header-inner">
    <a class="brand" routerLink="/nba" aria-label="sidequests home">
      <span class="brand-copy">
        <strong class="brand-wordmark">sidequests<span aria-hidden="true">.</span></strong>
        <small>scores, projects & curiosities</small>
      </span>
    </a>

    <div class="header-actions">
      <nav #sportsMenuRoot class="sports-nav" routerLinkActive="section-active" aria-label="Interest sections">
        <button
          #sportsMenuButton
          class="sports-menu-button"
          type="button"
          aria-haspopup="menu"
          [attr.aria-expanded]="sportsMenuOpen"
          aria-controls="sports-menu"
          (click)="toggleSportsMenu()"
          (keydown.arrowdown)="openSportsMenu($event)"
        >
          <span class="sports-ball" aria-hidden="true"></span>
          Sports
          <svg class="menu-chevron" [class.is-open]="sportsMenuOpen" aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 8 4 4 4-4" /></svg>
        </button>

        @if (sportsMenuOpen) {
          <div id="sports-menu" class="sports-menu" role="menu">
            <p>Scoreboards</p>
            <a routerLink="/nba" routerLinkActive="active" ariaCurrentWhenActive="page" role="menuitem" (click)="closeSportsMenu()">
              <span><strong>NBA</strong><small>Basketball</small></span><span class="menu-arrow" aria-hidden="true">→</span>
            </a>
            <a routerLink="/fifa" routerLinkActive="active" ariaCurrentWhenActive="page" role="menuitem" (click)="closeSportsMenu()">
              <span><strong>FIFA 2026</strong><small>World Cup</small></span><span class="menu-arrow" aria-hidden="true">→</span>
            </a>
          </div>
        }
      </nav>

      <button
        class="theme-toggle"
        type="button"
        (click)="toggleTheme()"
        [attr.aria-label]="isDarkTheme ? 'Switch to light theme' : 'Switch to dark theme'"
        [attr.title]="isDarkTheme ? 'Switch to light theme' : 'Switch to dark theme'"
      >
        @if (isDarkTheme) {
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41" /></svg>
        } @else {
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" /></svg>
        }
      </button>
    </div>
  </div>
</header>

<router-outlet />
