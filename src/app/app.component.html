<header class="site-header">
  <div class="header-inner">
    <a class="brand" routerLink="/nba" aria-label="banjitino.com scores home">
      <span class="brand-mark">B</span>
      <span>
        <strong>banjitino.com</strong>
        <small>Live scoreboards</small>
      </span>
    </a>

    <div class="header-actions">
      <nav class="board-nav" aria-label="Scoreboard sections">
        <a routerLink="/nba" routerLinkActive="active" ariaCurrentWhenActive="page">NBA</a>
        <a routerLink="/fifa" routerLinkActive="active" ariaCurrentWhenActive="page">FIFA 2026</a>
      </nav>

      <button
        class="theme-toggle"
        type="button"
        (click)="toggleTheme()"
        [attr.aria-label]="isDarkTheme ? 'Switch to light theme' : 'Switch to dark theme'"
        [attr.title]="isDarkTheme ? 'Switch to light theme' : 'Switch to dark theme'"
      >
        @if (isDarkTheme) {
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41" />
          </svg>
        } @else {
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
          </svg>
        }
      </button>
    </div>
  </div>
</header>

<router-outlet />
